site_name: Guia Azure DevOps
site_description: Padrões corporativos para planejar, executar e entregar a aplicação de MDM com Azure DevOps.
docs_dir: docs

theme:
  name: material
  language: pt
  font: false
  icon:
    logo: material/view-dashboard-outline
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/stylesheets/brand.css

nav:
  - Início: index.md
  - Fundamentos: fundamentos.md
  - Azure DevOps:
      - azure-devops/index.md
      - Configuração do projeto: azure-devops/configuracao.md
      - Entregas: azure-devops/entregas.md
      - Work items: azure-devops/work-items.md
      - Branches e commits: azure-devops/branches-e-commits.md
      - Pull requests: azure-devops/pull-requests.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
